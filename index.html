<!DOCTYPE html>
<html>
<head>
    <title>Enhanced Chat Example</title>
    <!-- Include meta tags here, if required -->
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1">
    <meta http-equiv="Content-Security-Policy" content="frame-ancestors 'self' https://boeingsupport--archsg.sandbox.my.site.com https://*.salesforce.com">
	<style>
        body {
            font-family: Arial, sans-serif;
            margin: 24px;
        }

        .field-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            padding: 8px;
            width: 300px;
            max-width: 100%;
            box-sizing: border-box;
        }

        button {
            padding: 10px 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Welcome to BPP-SF Support Page</h1>
    <p>Enter your details below, then click <strong>Set Fields</strong> before starting chat.</p>

	<div class="field-group">
        <label for="emailInput">Email</label>
        <input type="email" id="emailInput" placeholder="Enter your email">
    </div>

    <div class="field-group">
        <label for="codeInput">Customer Code</label>
        <input type="text" id="codeInput" placeholder="Enter your code">
    </div>

	<button id="setFieldsBtn">Set Fields</button>
    <!-- Paste the main Embedded Service Chat code snippet here. -->
    <script type='text/javascript'>
		let embeddedReady = false;

        window.addEventListener("onEmbeddedMessagingReady", () => {
            embeddedReady = true;
        });

        document.getElementById("setFieldsBtn").addEventListener("click", () => {
            const myEmail = document.getElementById("emailInput").value;
            const myCC = document.getElementById("codeInput").value;

            if (!embeddedReady) {
                alert("Chat is not ready yet. Please wait a moment and try again.");
                return;
            }

            embeddedservice_bootstrap.prechatAPI.setHiddenPrechatFields({
                "Customer_Email": myEmail,
                "Customer_Code": myCC
            });

            alert("Fields set successfully.");
        });

	function initEmbeddedMessaging() {
		try {
			embeddedservice_bootstrap.settings.language = 'en_US'; // For example, enter 'en' or 'en-US'

			embeddedservice_bootstrap.init(
				'00DWJ000008QbfF',
				'FR_Chat_Channel',
				'https://boeingsupport--archsg.sandbox.my.site.com/ESWFRChatChannel1777586524547',
				{
					scrt2URL: 'https://boeingsupport--archsg.sandbox.my.salesforce-scrt.com'
				}
			);
		} catch (err) {
			console.error('Error loading Embedded Messaging: ', err);
		}
	};
</script>
<script type='text/javascript' src='https://boeingsupport--archsg.sandbox.my.site.com/ESWFRChatChannel1777586524547/assets/js/bootstrap.min.js' onload='initEmbeddedMessaging()'></script>
  
</body>
</html>
