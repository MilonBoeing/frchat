<!DOCTYPE html>
<html>
<head>
    <title>Enhanced Chat Example</title>
    <!-- Include meta tags here, if required -->
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1">

</head>
<body>
    <h1>Welcome to Our Support Page</h1>
    <p>Click the chat icon to begin.</p>

    <!-- Paste the main Embedded Service Chat code snippet here. -->
    <script type='text/javascript'>
    window.addEventListener("onEmbeddedMessagingReady", () => {
        // Send data to Salesforce
        embeddedservice_bootstrap.prechatAPI.setHiddenPrechatFields({"myEmail" : "milon.k.dey@boeing.com"});
        console.log("Received the onEmbeddedMessagingReady event…");
        // Remove any items from the previous list that you don't want to send
        embeddedservice_bootstrap.prechatAPI.removeHiddenPrechatFields(["myEmail"]);
        console.log('Email removed');
    });
  	function initEmbeddedMessaging() {
  		try {
  			embeddedservice_bootstrap.settings.language = 'en_US'; // For example, enter 'en' or 'en-US'
           
  			embeddedservice_bootstrap.init(
  				'00DWK000005KMcb',
  				'FR_Chat_Channel',
  				'https://boeingsupport--devpoc.sandbox.my.site.com/ESWFRChatChannel1773857684923',
  				{
  					scrt2URL: 'https://boeingsupport--devpoc.sandbox.my.salesforce-scrt.com'
  				}
  			);
  		} catch (err) {
  			console.error('Error loading Embedded Messaging: ', err);
  		}
  	};
  </script>
  <script type='text/javascript' src='https://boeingsupport--devpoc.sandbox.my.site.com/ESWFRChatChannel1773857684923/assets/js/bootstrap.min.js' onload='initEmbeddedMessaging()'></script>

  
</body>
</html>
